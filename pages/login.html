<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Східницький ЗЗСО I-III рівнів</title>

    <link rel="stylesheet" href="styles/basic.css">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/auth.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section id="login-sec" class="auth-section">
            <a href="/" class="logo-container" id="auth-logo-container">
                <img src="images/logo-crop.png" alt="Логотип смт Східниця" class="logo" id="auth-logo">
                <div class="logo-text">
                    <span class="school-name" id="auth-school-name">Східницький ЗЗСО</span>
                    <span class="school-levels" id="auth-school-levels">I-III рівнів</span>
                </div>
            </a>
            <div class="auth-container">
                <div class="form-type">
                    <button type="button" class="login form-switch active" data-form="login-form">Вхід</button>
                    <button type="button" class="activation form-switch" data-form="activation-form">Активація запрошення</button>
                </div>
                <form class="auth-form" id="login-form">
                    <label for="login-email">Електронна пошта</label>
                    <input type="email" name="email" id="login-email" class="form-inp" placeholder="example@gmail.com" required>
                    
                    <label for="login-password">Пароль</label>
                    <input type="password" name="password" id="login-password" class="form-inp" placeholder="Введіть пароль" required>
                
                    <div class="link-container">
                    <a href="/" class="back-link" id="auth-back-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
                        <span>На головну</span>
                    </a>
                    <a href="/reset-password" class="forgot-pass auth-link">Забули пароль?</a>
                </div>

                    <button type="submit" class="submit-btn">Увійти</button>
                </form>  
                <form class="auth-form hidden" id="activation-form">
                    <label for="activation-full-name">ПІБ</label>
                    <input type="text" name="fullName" id="activation-full-name" class="form-inp" placeholder="Кароліна Олександрівна Якубець" required>

                    <label for="activation-email">Електронна пошта</label>
                    <input type="email" name="email" id="activation-email" class="form-inp" placeholder="example@gmail.com" autocomplete="email" required>
                    
                    <label for="activation-password">Пароль</label>
                    <input type="password" name="password" id="activation-password" class="form-inp" placeholder="Введіть пароль" required>

                    <label for="confirm-password">Повторіть пароль</label>
                    <input type="password" name="confirmPassword" id="confirm-password" class="form-inp" placeholder="Повторіть пароль" required>

                    <button type="submit" class="submit-btn">Активувати</button>
                </form>   
            </div>
        </section>
    </main>


    <script src="scripts/form-switch.js"></script>
</body>
</html>
